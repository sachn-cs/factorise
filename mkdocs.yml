site_name: factorise
site_description: Deterministic prime factorisation for Python
site_url: https://sachn-cs.github.io/factorise/
repo_url: https://github.com/sachn-cs/factorise
repo_name: sachn-cs/factorise

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonitions
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            members_order: source
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference:
      - Core: api/core.md
      - Configuration: api/config.md
      - Pipeline: api/pipeline.md
      - Hybrid Engine: api/hybrid.md
      - CLI: api/cli.md
  - Algorithms:
      - Miller-Rabin: miller_rabin.md
      - Pollard's Rho: pollards_rho.md
      - Pollard's Rho (Brent): pollards_rho_brent.md
      - Trial Division: trial_division.md
      - Pollard p-1: pollard_pm1.md
      - ECM: ecm.md
      - Quadratic Sieve: quadratic_sieve.md
      - SIQS: siqs.md
      - GNFS: gnfs.md
      - References: references.md
  - Architecture: architecture.md
  - Deployment: deployment.md
  - FAQ: faq.md
  - Contributing: contributing.md
  - Changelog: changelog.md
